name: Build Signed Kotlin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # ساخت فایل امضای دیجیتالی رسمی (Keystore)
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=Flashlight, OU=Dev, O=App, L=City, S=State, C=IR"

    - name: Build Unsigned Release APK
      run: ./gradlew assembleRelease

    # امضا کردن فایل APK با کلید ساخته شده
    - name: Sign Release APK
      uses: rExecutable/r-binaries/actions/sign-apk@main
      continue-on-error: true

    # آماده‌سازی با apksigner اختصاصی
    - name: Sign APK manually using Android SDK
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:mypassword --key-pass pass:mypassword --out app-signed-release.apk app/build/outputs/apk/release/app-release-unsigned.apk || \
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:mypassword --key-pass pass:mypassword --out app-signed-release.apk app/build/outputs/apk/release/app-release.apk

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Modern-Flashlight-Signed
        path: app-signed-release.apk
